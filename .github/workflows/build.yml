name: Build SkipAds.dylib

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Install ldid
        run: brew install ldid

      - name: Build dylib
        run: make

      - name: Copy dylib to visible path
        run: |
          cp .theos/obj/debug/arm64/SkipAds.dylib ./SkipAds.dylib
          ls -la SkipAds.dylib

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: SkipAds-dylib
          path: SkipAds.dylib
          if-no-files-found: error
